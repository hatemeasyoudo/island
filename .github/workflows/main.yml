name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources (if uploaded as zip)
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Распаковываю $f"
            unzip -o "$f"
          done
          ls -la
          test -f project.yml || { echo "Нет project.yml: загрузи архив IslandPets-source.zip в корень репозитория"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project IslandPets.xcodeproj \
            -scheme IslandPets \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Embed entitlements (ad-hoc sign)
        run: |
          APP=build/Build/Products/Release-iphoneos/IslandPets.app
          codesign -f -s - --entitlements Support/Widget.entitlements "$APP/PlugIns/IslandPetsWidget.appex"
          codesign -f -s - --entitlements Support/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IslandPets.app Payload/
          zip -qry IslandPets.ipa Payload
          ls -la IslandPets.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IslandPets-ipa
          path: IslandPets.ipa
